[workspace]
resolver = "2"
members = ["trigger-engine", "trigger-engine-web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sam Rivera"]
license = "UNLICENSED"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
content-crypto = { path = "../../../../trillion-rust/crates/content-crypto" }
getrandom = { version = "0.4" }
hex = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
slot-protocol = { path = "../../shared-code/crates/slot-protocol" }
thiserror = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
