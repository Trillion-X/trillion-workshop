[package]
name = "trigger-engine-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The trigger engine for a wasm host: record changes in, matched rules dispatched through the host's answer"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
trigger-engine = { path = "../trigger-engine" }
slot-protocol.workspace = true
content-crypto.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
hex.workspace = true
serde_json.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
# ops-core (under composition-ast) pulls rand -> getrandom 0.2; evaluating a rule never draws entropy.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["custom"] }
