<section class="page-section page-section--welcome" data-step="code" hidden>{{site_mark}}<h1 class="page-heading">Connect a device</h1><p class="page-body">Type the code your device shows.</p><form class="page-choices" method="get" action="/device"><div class="page-fields"><div class="page-field"><label class="page-field-label" for="page-field-user_code">Code</label><input class="page-field-input" id="page-field-user_code" name="user_code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12" required autofocus type="text"/></div></div><button class="page-action page-choices-send" type="submit">Continue</button></form><p class="page-status" role="status" aria-live="polite"></p></section><section class="page-section page-section--welcome" data-step="review" hidden>{{site_mark}}<h1 class="page-heading" data-fill="heading">{client} wants to use your {{name}}</h1><p class="page-body" data-fill="where">Its code is {code}. It will be able to:</p><ul class="page-items" data-fill-list="scopes"></ul><p class="page-body">Only approve a device you are holding.</p><div class="page-actions"><button class="page-action" type="button" data-device="allow">Allow</button><button class="page-action page-action--quiet" type="button" data-device="deny">Deny</button></div><p class="page-status" role="status" aria-live="polite"></p></section><section class="page-section page-section--welcome" data-step="done" hidden>{{site_mark}}<h1 class="page-heading" data-fill="done-heading">Done</h1><p class="page-body" data-fill="done-body">Go back to your device.</p></section>
