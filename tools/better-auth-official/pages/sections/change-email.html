<section class="page-section page-section--welcome">{{site_mark}}<h1 class="page-heading">Change your email</h1><p class="page-body">We send a link to your current address to approve this, then one to the new address to prove it is yours.</p><form class="page-choices" method="post" action="/sign-in/change-email"><div class="page-fields"><div class="page-field"><label class="page-field-label" for="page-field-new_email">New email</label><input class="page-field-input" id="page-field-new_email" name="new_email" autocomplete="email" inputmode="email" required placeholder="you@example.com" type="email"/></div></div><button class="page-action page-choices-send" type="submit">Send the links</button></form><p class="page-status" role="status" aria-live="polite"></p></section><section class="page-section page-section--fine"><div class="page-actions"><a class="page-action page-action--link" href="/">Back</a></div></section>
