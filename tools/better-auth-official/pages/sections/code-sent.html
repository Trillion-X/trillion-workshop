<section class="page-section page-section--welcome" data-page-step="code">{{site_mark}}<h1 class="page-heading">Check your email</h1><p class="page-body">We sent a 6-digit code to <strong class="page-sent-to-address" data-page-sent-to>{name}</strong>. It works for {{minutes}} minutes. Check your spam folder if it does not arrive.</p><p class="page-sent-to"><a class="page-sent-to-change" href="/sign-in">Change email</a></p><form class="page-choices" method="post" action="/sign-in/way"><input type="hidden" name="way" value="email-code"/><input type="hidden" name="sign_in_email" value="{name}"/><div><div class="page-fields"><div class="page-field page-field--code"><span class="page-field-label page-field-label--unseen" id="page-field-code-label">Code</span><div class="page-code" role="group" aria-labelledby="page-field-code-label" data-page-code><input class="page-code-box" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" aria-label="Code, digit 1 of 6" autofocus/><input class="page-code-box" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Code, digit 2 of 6"/><input class="page-code-box" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Code, digit 3 of 6"/><input class="page-code-box" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Code, digit 4 of 6"/><input class="page-code-box" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Code, digit 5 of 6"/><input class="page-code-box" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Code, digit 6 of 6"/><input type="hidden" id="page-field-code" name="code" value=""/></div></div></div><div class="page-actions"><button class="page-action" type="submit">Sign in</button><form class="page-action-form" method="post" action="/sign-in/way/send"><input type="hidden" name="way" value="email-code"/><input type="hidden" name="sign_in_email" value="{name}"/><button class="page-action page-action--link" type="submit">Send a new code</button></form></div></div></form><p class="page-status" role="status" aria-live="polite"></p></section><section class="page-section page-section--fine"><div class="page-actions"><a class="page-action page-action--link" href="/sign-in">Back to sign in</a></div></section>
