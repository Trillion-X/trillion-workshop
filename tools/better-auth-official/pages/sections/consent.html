<section class="page-section page-section--welcome" data-step="review" hidden>{{brand_mark}}<h1 class="page-heading" data-fill="heading">{client} wants to work in your {{name}}.</h1><p class="page-body" data-unknown hidden>We don't know this app.</p><div class="page-actions"><button class="page-action" type="button" data-consent="allow">Allow</button><button class="page-action page-action--quiet" type="button" data-consent="deny">Deny</button></div><p class="page-status" role="status" aria-live="polite"></p></section><section class="page-section page-section--fine" data-step="review" hidden><div class="page-actions"><button class="page-action page-action--link" type="button" data-details aria-expanded="false">Details</button></div><div data-details-panel hidden><p class="page-body">It will be able to:</p><ul class="page-items" data-fill-list="scopes"></ul><button class="page-action page-action--link" type="button" data-read-only aria-pressed="false">Read only: off</button></div><p class="page-body">Not you? <a class="page-prompt-link" href="/sign-in" data-switch-account>Sign out</a></p></section><section class="page-section page-section--welcome" data-step="remembered" hidden>{{brand_mark}}<h1 class="page-heading" data-fill="remembered-heading">Connecting {client}</h1><p class="page-body">You already allowed it.</p><div class="page-actions"><button class="page-action" type="button" data-consent="allow">Continue now</button><button class="page-action page-action--quiet" type="button" data-undo>Undo</button></div><p class="page-status" role="status" aria-live="polite"></p></section><section class="page-section page-section--welcome" data-step="signedin" hidden>{{brand_mark}}<h1 class="page-heading">You're signed in.</h1><p class="page-body">You can close this tab.</p></section>
