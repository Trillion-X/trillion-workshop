<section class="page-section page-section--welcome">{{brand_mark}}<h1 class="page-heading">Create an access key</h1><p class="page-body">A key lets an AI or a computer of yours use your {{name}} account. It is shown once, here.</p><div class="page-fields"><div class="page-field"><label class="page-field-label" for="page-field-key-name">Name for this key</label><input class="page-field-input" id="page-field-key-name" name="key-name" maxlength="100" placeholder="This computer" type="text"/></div><div class="page-field"><label class="page-field-label" for="page-field-made-key">Your key</label><input class="page-field-input" id="page-field-made-key" name="made-key" readonly hidden type="text"/></div></div><div class="page-actions"><button class="page-action" type="button" data-key data-failed="That did not work. Try again.">Create an access key</button><a class="page-action page-action--link" href="/">Not now</a></div><p class="page-status" role="status" aria-live="polite"></p></section>
