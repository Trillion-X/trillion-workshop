<section class="page-section page-section--welcome">{{site_mark}}<h1 class="page-heading">Reset your password</h1><p class="page-body">We&#39;ll email you a 6-digit code. It works once, for {{minutes}} minutes.</p><form class="page-choices" method="post" action="/sign-in/way/send"><input type="hidden" name="way" value="email-code"/><input type="hidden" name="reset" value="1"/><div><div class="page-fields"><div class="page-field"><label class="page-field-label" for="page-field-sign_in_email">Email</label><input class="page-field-input" id="page-field-sign_in_email" name="sign_in_email" autocomplete="email" inputmode="email" placeholder="you@example.com" type="email"/></div></div><div class="page-actions"><button class="page-action" type="submit">Email me a code</button></div></div></form><p class="page-status" role="status" aria-live="polite"></p></section><section class="page-section page-section--fine"><div class="page-actions"><a class="page-action page-action--link" href="/sign-in">Back to sign in</a></div></section>
