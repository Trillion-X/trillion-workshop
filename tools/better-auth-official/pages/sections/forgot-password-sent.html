<section class="page-section page-section--welcome"><img class="page-mark" src="/sign-in/assets/mark.svg" alt="Trillion" width="64" height="64" decoding="async"/><h1 class="page-heading">Check your email</h1><p class="page-body">If this email has a Trillion account, a 6-digit code is on its way. It works for {{minutes}} minutes. Check your spam folder if it does not arrive.</p><p class="page-sent-to">Sent to <strong class="page-sent-to-address" data-page-sent-to>{name}</strong> <a class="page-sent-to-change" href="/sign-in">Change email</a></p><form class="page-choices" method="post" action="/sign-in/way"><input type="hidden" name="way" value="email-code"/><input type="hidden" name="reset" value="1"/><input type="hidden" name="sign_in_email" value="{name}"/><div><div class="page-fields"><div class="page-field page-field--code"><span class="page-field-label page-field-label--unseen" id="page-field-code-label">Code</span><div class="page-code" role="group" aria-labelledby="page-field-code-label" data-page-code><input class="page-code-box" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" aria-label="Code, digit 1 of 6"/><input class="page-code-box" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Code, digit 2 of 6"/><input class="page-code-box" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Code, digit 3 of 6"/><input class="page-code-box" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Code, digit 4 of 6"/><input class="page-code-box" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Code, digit 5 of 6"/><input class="page-code-box" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Code, digit 6 of 6"/><input type="hidden" id="page-field-code" name="code" value=""/></div></div><div class="page-field"><label class="page-field-label" for="page-field-new_password">New password</label><div class="page-field-box"><input class="page-field-input" id="page-field-new_password" name="new_password" autocomplete="new-password" required placeholder="At least 8 characters" type="password"/><button class="page-field-reveal" type="button" data-page-reveal aria-controls="page-field-new_password" aria-pressed="false" aria-label="Show password" data-show="Show password" data-hide="Hide password"><svg class="page-reveal-show" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="page-reveal-hide" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.7 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.2 3.2M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M2 2l20 20"/></svg></button></div></div></div><div class="page-actions"><button class="page-action" type="submit">Set new password</button><form class="page-action-form" method="post" action="/sign-in/way/send"><input type="hidden" name="way" value="email-code"/><input type="hidden" name="reset" value="1"/><input type="hidden" name="sign_in_email" value="{name}"/><button class="page-action page-action--link" type="submit">Send a new code</button></form></div></div></form><p class="page-status" role="status" aria-live="polite"></p></section><section class="page-section page-section--fine"><div class="page-actions"><a class="page-action page-action--link" href="/sign-in">Back to sign in</a></div></section>
