<!doctype html>
<!-- Made-up Gemini conversation page, shaped as gemini.google.com draws one: each turn a .conversation-container with its
     own id holding a user-query and a model-response; hidden labels and buttons around the words. -->
<html><head><title>Gemini</title></head>
<body>
<bard-sidenav><div class="conversation selected"><div class="conversation-title">Trip to Lisbon</div></div></bard-sidenav>
<chat-window>
  <div class="conversation-container" id="r_1a2b3c">
    <user-query><span class="cdk-visually-hidden">You said</span><div class="query-text"><p class="query-text-line">Plan two days in Lisbon</p><p class="query-text-line">on foot</p></div></user-query>
    <model-response><message-content><div class="markdown"><p>Day one: Alfama and the castle.</p><p>Day two: Belém.</p></div></message-content><sources-list>Sources: example.com</sources-list><button>Share</button></model-response>
  </div>
  <div class="conversation-container" id="r_4d5e6f">
    <user-query><div class="query-text"><p class="query-text-line">Where to eat?</p></div></user-query>
    <model-response><message-content><div class="markdown"><p>Try a tasca near the river.</p></div></message-content></model-response>
  </div>
</chat-window>
</body></html>
