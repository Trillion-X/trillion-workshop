# crates/formula-ast/Cargo.toml
#
# Formula AST — Shared Expression Types (Leaf Crate)
#
# Pure data types for the formula abstract syntax tree.
# Zero runtime logic, zero heavy dependencies.
# Both formula-engine (evaluator) and trigger-engine (condition matcher)
# import from here instead of depending on each other.
#
# L088: This is the natural bedrock for Expression types — the deepest
# shared ancestor where N>1 consumers (formula-engine, trigger-engine,
# interaction-engine) converge.

[package]
name = "formula-ast"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Formula AST types — shared Expression leaf crate for inter-slot decoupling"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
