# crates/evaluate-over-rows/Cargo.toml
#
# The formula engine's binding evaluator, compiled for a JavaScript host
# (browser page, Node worker thread). It holds a table of plain JSON rows and
# answers "which rows does this binding hold for", using the same
# composition-ast evaluator and ops-core operators the formula-engine slot uses.
# No operator logic lives here; this crate only carries rows across the
# host boundary and loops.

[package]
name = "formula-engine-evaluate-over-rows"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true

# ops-core pulls rand 0.8 -> getrandom 0.2, which refuses to compile for
# wasm32-unknown-unknown without a chosen backend. Evaluating a binding never
# needs entropy, so the backend registered in src/lib.rs reports "unavailable"
# instead of importing JavaScript glue; the module stays a plain WebAssembly
# module any host can instantiate without a loader.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["custom"] }
wasm-bindgen.workspace = true
