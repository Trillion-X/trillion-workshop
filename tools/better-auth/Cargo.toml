[package]
name = "better-auth-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
description = "Better Auth (better-auth-rs) served over axum: email and password, passkeys and JWT with JWKS, on a SQLite file"

[[bin]]
name = "better-auth-server"
path = "src/main.rs"

[dependencies]
better-auth = { git = "https://github.com/better-auth-rs/better-auth-rs", rev = "23c89f4e51999fe5767804879c82c60249cf9f84", features = ["axum", "seaorm2"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
