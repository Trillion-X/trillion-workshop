[workspace]
resolver = "2"
members = ["composition-engine", "composition-engine-core", "state-graph"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sam Rivera"]
license = "UNLICENSED"

[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
criterion = { version = "0.5", features = ["html_reports"] }
getrandom = { version = "0.4" }
hex = "0.4"
lazy_static = "1"
regex = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
slot-protocol = { path = "../../shared-code/crates/slot-protocol" }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
wasm-bindgen = "0.2"
web-time = "1"
