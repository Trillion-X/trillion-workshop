[workspace]
resolver = "2"
members = ["composition-ast", "execution-types", "graph", "json-canonicalization", "ops-core", "resilience", "shared-slot-batches", "slot-protocol"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sam Rivera"]
license = "UNLICENSED"

[workspace.dependencies]
arc-swap = "1.7"
async-trait = "0.1"
base64 = "0.22"
bincode = "1.3"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"
ciborium = "0.2"
content-crypto = { path = "../../../../trillion-rust/crates/content-crypto" }
criterion = { version = "0.5", features = ["html_reports"] }
execution-types = { path = "execution-types" }
futures = "0.3"
getrandom = { version = "0.4" }
hex = "0.4"
hmac = "0.12"
icu_casemap = { version = "1", features = ["compiled_data"] }
icu_normalizer = { version = "1", features = ["compiled_data"] }
im = { version = "15", features = ["serde"] }
inventory = "0.3"
js-sys = "0.3"
json-canonicalization = { path = "json-canonicalization" }
lazy_static = "1"
once_cell = "1"
parking_lot = "0.12"
regex = "1"
resilience = { path = "resilience" }
rust_decimal = { version = "1.35.0", features = ["maths"] }
rust_decimal_macros = "1.35.0"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
sha3 = "0.10"
shared-slot-batches = { path = "shared-slot-batches" }
slot-protocol = { path = "slot-protocol" }
thiserror = "1"
tokio = { version = "1", features = ["sync", "macros"] }
toml = "0.8"
tracing = "0.1"
tsify-next = "0.5"
unicode-normalization = "0.1"
unicode-segmentation = "1.10"
urlencoding = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-time = "1"
wit-bindgen = { version = "0.55", default-features = false, features = ["realloc", "macros", "async"] }
