[package]
name = "trigger-ast"
version = "0.1.0"
edition = "2021"
description = "Pre-compiled trigger types and evaluator — shared leaf between interaction-engine and composition-engine"

[dependencies]
# Formula AST leaf crate — AST types + Parser/Lexer (pure syntax, zero I/O)
formula-ast = { path = "../formula-ast" }

# Formula Core — pure compute leaf (Compiler, Solver, Optimizer). Zero I/O.
formula-core = { path = "../formula-core" }

# Serialization
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
