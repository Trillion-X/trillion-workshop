[package]
name = "execution-types"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
slot-protocol = { workspace = true }
json-canonicalization = { workspace = true }
hex = { workspace = true }
content-crypto = { workspace = true }

[features]
# When enabled, the golden-contract tests rewrite crates/execution-types/
# contracts/* from the in-source golden fixtures and print the refreshed
# hash constants instead of asserting. Run after any deliberate wire change:
#   cargo test -p execution-types --features regenerate-goldens
regenerate-goldens = []

[dev-dependencies]

[lib]
path = "src/lib.rs"
