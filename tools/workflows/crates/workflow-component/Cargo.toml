[package]
name = "workflow-component"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The workflow engine as one WebAssembly component: a run in on standard input, where it stands and what it needs next out"

[[bin]]
name = "workflow_component"
path = "src/main.rs"

[dependencies]
workflow-engine = { path = "../workflow-engine" }
workflow-core = { path = "../workflow-core", default-features = false }
async-trait.workspace = true
serde_json.workspace = true
futures.workspace = true
chrono.workspace = true
# The pin of a definition read by recipe (main.rs `pinned_definition`): the BLAKE3 of its JSON.
blake3 = { version = "1.8.5", default-features = false }

# ask-rights.json, ask-words.json and run-end.json are read into the component (main.rs `ASK_RIGHTS`, `ASK_WORDS`,
# `RUN_END`), so a change to any of them builds the component again.
[package.metadata.compiled-module]
source-files = ["../../ask-rights.json", "../../ask-words.json", "../../run-end.json"]
