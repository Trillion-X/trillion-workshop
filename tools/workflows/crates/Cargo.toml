[workspace]
resolver = "2"
members = ["journal-ast", "workflow-core", "workflow-engine", "workflow-component"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sam Rivera"]
license = "UNLICENSED"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
ciborium = "0.2"
content-crypto = { path = "../../../../trillion-rust/crates/content-crypto" }
execution-types = { path = "../../shared-code/crates/execution-types" }
futures = "0.3"
getrandom = { version = "0.4" }
hex = "0.4"
js-sys = "0.3"
rand = "0.10"
resilience = { path = "../../shared-code/crates/resilience" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
slot-protocol = { path = "../../shared-code/crates/slot-protocol" }
thiserror = "1"
tokio = { version = "1", features = ["sync", "macros"] }
tracing = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-time = "1"
wit-bindgen = { version = "0.55", default-features = false, features = ["realloc", "macros", "async"] }
