[workspace]
resolver = "2"
members = ["screen-arrangement"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sam Rivera"]
license = "UNLICENSED"

[workspace.dependencies]
getrandom = { version = "0.4" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
wasm-bindgen = "0.2"
