[package]
name = "icu-collation"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
description = "The engine's tool-label collation: ICU 78.2 built from its pinned source and linked statically."

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

# build.rs builds the pinned ICU 78.2 source (icu-source.json, beside it) and checks its BLAKE3 with the engine's
# own primitive.
[build-dependencies]
content-crypto = { path = "../content-crypto" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
