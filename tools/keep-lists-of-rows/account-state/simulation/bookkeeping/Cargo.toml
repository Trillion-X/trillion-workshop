[package]
name = "command-bookkeeping"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
description = "The durable writes around one command, simulated under faults with oracles for money, authority and acknowledged answers: lease blocks per basis (origin/main 050254ab91) against the floor design (one receipt in the domain's own transaction inside a use envelope and an admission lease)."

# Standalone package: it simulates protocols, not the storage engine, so it never builds the parent crate.
[workspace]

[[bin]]
name = "command-bookkeeping"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149" }

[profile.release]
debug = 0
