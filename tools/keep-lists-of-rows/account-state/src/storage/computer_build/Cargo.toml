# The computer build: the engine's storage boundary compiled for a computer whose storage its host lends through one
# statement call (wasm32-unknown-unknown). It compiles the engine's own files by path (src/storage), never copies of
# them, with cfg `computer_build` leaving out what needs a database file or the rest of the engine. README.md says what it
# holds, what it leaves out and why; .cargo/build-targets.json holds the measured gap.
[package]
name = "trillion-place"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["raw_value", "float_roundtrip"] }

[workspace]

[profile.release]
opt-level = "s"
lto = true
