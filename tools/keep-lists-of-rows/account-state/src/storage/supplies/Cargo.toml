[package]
name = "storage-supplies"
version = "0.1.0"
edition = "2021"
autotests = false
license = "UNLICENSED"
description = "Storage supplies for other databases: the same Storage contract the record store runs on, over Postgres, MySQL, Redis and other real servers, each behind a Cargo feature so the default build pulls in no driver."

# Standalone package: the parent trillion-local manifest is shared by many sessions and is not a workspace, and
# declaring a module in src/storage/mod.rs would edit a file another owner holds. Run from this folder; see README.md.
[workspace]

[lib]
name = "storage_supplies"
path = "lib.rs"

[dependencies]
local_engine = { package = "trillion-local", path = "../../.." } # PACKAGE-SET-IDENTITY-EXEMPT: the parent crate whose Storage contract these supplies implement, named once here
serde_json = "=1.0.149"
postgres = { version = "0.19", optional = true }
ureq = { version = "2", optional = true, default-features = false, features = ["json"] }
base64 = { version = "=0.22.1", optional = true }
# hash-crate-direct-dep: Signature V4, the request signing S3 mandates, is HMAC-SHA256; these are not content identities.
hmac = { version = "=0.12.1", optional = true }
sha2 = { version = "=0.10.9", optional = true }
chrono = { version = "=0.4.42", optional = true, default-features = false, features = ["std"] }
redis = { version = "0.32", optional = true }
mongodb = { version = "3", optional = true, default-features = false, features = ["sync", "compat-3-0-0", "rustls-tls"] }
mysql = { version = "25", optional = true, default-features = false, features = ["minimal"] }

[dev-dependencies]
tempfile = "=3.24.0"
rusqlite = { version = "=0.32.1", features = ["bundled"] }

[features]
default = []
postgres = ["dep:postgres"]
mysql = ["dep:mysql"]
redis = ["dep:redis"]
dynamodb = ["dep:ureq", "dep:base64"]
libsql = ["dep:ureq", "dep:base64"]
mongo = ["dep:mongodb"]
couchdb = ["dep:ureq", "dep:base64"]
surreal = ["dep:ureq", "dep:base64"]
s3 = ["dep:ureq", "dep:hmac", "dep:sha2", "dep:chrono"]

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "differential"
path = "tests/differential.rs"

[[test]]
name = "roundtrips"
path = "tests/roundtrips.rs"

[[test]]
name = "write_reads"
path = "tests/write_reads.rs"
