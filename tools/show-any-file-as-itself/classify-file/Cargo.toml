[package]
name = "file-classification"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Classify supplied file paths into a language, a renderer hint, an icon, a label and a MIME type, without reading any file"
autotests = false

[lib]
name = "file_classification"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
