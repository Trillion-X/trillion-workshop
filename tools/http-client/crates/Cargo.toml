[workspace]
resolver = "2"
members = ["http-client"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sam Rivera"]
license = "UNLICENSED"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
content-crypto = { path = "../../../../trillion-rust/crates/content-crypto" }
execution-types = { path = "../../../../trillion-rust/crates/execution-types" }
hex = "0.4"
hmac = "0.12"
js-sys = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
slot-protocol = { path = "../../../../trillion-rust/crates/slot-protocol" }
ssrf-policy = { path = "../../refuse-requests-to-private-addresses/crates/ssrf-policy" }
thiserror = "1"
tokio = { version = "1", features = ["sync", "macros"] }
tracing = "0.1"
url = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-time = "1"
wit-bindgen = { version = "0.55", default-features = false, features = ["realloc", "macros", "async"] }
zeroize = { version = "1", features = ["derive"] }
